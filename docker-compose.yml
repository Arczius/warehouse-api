services:
  db:
    image: postgres:18
    container_name: postgres-warehouse-api
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_USER: ${DB_USERNAME:-john}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  warehouse-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=${DB_PORT:-5432};Database=warehouse;Username=${DB_USERNAME:-john};Password=${DB_PASSWORD:-secret}"
      ASPNETCORE_ENVIRONMENT: ${ASP_ENVIRONMENT:-Development}
    restart: unless-stopped
    depends_on:
    - db
volumes:
  postgres_data:
